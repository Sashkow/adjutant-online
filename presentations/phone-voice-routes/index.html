<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adjutant on the Phone</title>
<style>
  :root {
    --bg: #070b10; --panel: #0d1520; --line: #1f3a52; --ink: #b9d4e8; --dim: #4b6377;
    --accent: #36e2ff; --good: #5df29a; --warn: #ffcc4d; --bad: #ff5a5a; --glow: rgba(54, 226, 255, .55);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 16px/1.4 "DejaVu Sans Mono", "Fira Mono", ui-monospace, monospace; overflow: hidden; }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px); }
  #stage { position: absolute; inset: 0 0 120px 0; display: flex; align-items: center; justify-content: center; }
  svg { width: 100%; height: 100%; }
  header { position: absolute; top: 14px; left: 24px; z-index: 3; }
  header .kicker { color: var(--dim); font-size: 13px; letter-spacing: .2em; text-transform: uppercase; }
  header h1 { margin: 2px 0 0; font-size: 26px; color: var(--accent); font-weight: 600; letter-spacing: .04em;
    text-shadow: 0 0 12px var(--glow); }
  #caption { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; padding: 18px 40px;
    background: linear-gradient(transparent, rgba(0,0,0,.8) 30%); font-size: 22px; text-align: center; z-index: 3; }
  #caption .cur { color: #fff; text-shadow: 0 0 10px var(--glow); }
  #progress { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); width: 0; z-index: 4;
    box-shadow: 0 0 8px var(--glow); }
  #cards { position: absolute; right: 28px; bottom: 140px; width: 360px; z-index: 3; display: flex; flex-direction: column; gap: 8px;
    transition: filter .4s; }
  #cards div { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    padding: 8px 12px; font-size: 15px; opacity: 0; transform: translateX(30px); transition: opacity .5s, transform .5s; }
  #cards.in div { opacity: 1; transform: none; }
  #cards.hl div { border-color: var(--accent); box-shadow: 0 0 14px var(--glow); }
  #start { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 10;
    background: rgba(0,0,0,.6); }
  #start button { font: inherit; font-size: 24px; color: var(--bg); background: var(--accent); border: 0; padding: 16px 36px;
    cursor: pointer; box-shadow: 0 0 30px var(--glow); }
  #start p { position: absolute; bottom: 30%; color: var(--dim); }
  .hidden { display: none !important; }

  /* diagram */
  .el { opacity: 0; transition: opacity .6s; }
  .el.on { opacity: 1; }
  .box rect { fill: var(--panel); stroke: var(--line); stroke-width: 2; transition: stroke .3s, filter .3s; }
  .box text { fill: var(--ink); font-size: 17px; }
  .box .sub { fill: var(--dim); font-size: 13px; }
  .box.frame > rect { fill: rgba(13, 21, 32, .5); }
  .box.dashed rect { stroke-dasharray: 7 5; }
  .el.hl rect { stroke: var(--accent); filter: drop-shadow(0 0 8px var(--glow)); }
  .el.hl text { fill: #fff; }
  .chip rect { rx: 18; }
  .good text.badge { fill: var(--good); } .warn text.badge { fill: var(--warn); } .bad text.badge { fill: var(--bad); }
  .arrow path { fill: none; stroke: var(--dim); stroke-width: 2.5; marker-end: url(#head); }
  .arrow.hl path { stroke: var(--accent); stroke-dasharray: 10 8; animation: flow .8s linear infinite;
    filter: drop-shadow(0 0 5px var(--glow)); marker-end: url(#headHl); }
  @keyframes flow { to { stroke-dashoffset: -18; } }
  .mark text { font-size: 15px; }
  .mark.good text { fill: var(--good); } .mark.bad text { fill: var(--bad); }
  .cross path { stroke: var(--bad); stroke-width: 7; stroke-linecap: round; filter: drop-shadow(0 0 6px rgba(255,90,90,.7)); }
  .el.hl.cross path, .el.hl.mark text { animation: pulse 1s ease-in-out infinite alternate; }
  @keyframes pulse { from { opacity: .6; } to { opacity: 1; } }
</style>
</head>
<body>
<header><div class="kicker">Adjutant voice · phone routes</div><h1 id="title"></h1></header>
<div id="stage">
<svg viewBox="0 0 1280 720" aria-label="Architecture diagram">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4b6377"/></marker>
    <marker id="headHl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#36e2ff"/></marker>
  </defs>

  <!-- phone -->
  <g id="phone" class="el box frame"><rect x="40" y="80" width="260" height="560" rx="30"/>
    <text x="170" y="112" text-anchor="middle">Android phone</text></g>
  <g id="app" class="el box frame"><rect x="58" y="128" width="224" height="330" rx="12"/>
    <text x="170" y="152" text-anchor="middle" class="sub">Claude app</text></g>
  <g id="chip-voice" class="el box chip"><rect x="80" y="168" width="180" height="40"/><text x="170" y="194" text-anchor="middle">voice mode</text></g>
  <g id="chip-spell" class="el box chip"><rect x="80" y="220" width="180" height="40"/><text x="170" y="246" text-anchor="middle">spell</text></g>
  <g id="chip-say" class="el box chip"><rect x="80" y="272" width="180" height="40"/><text x="170" y="298" text-anchor="middle">say</text></g>
  <g id="player" class="el box"><rect x="80" y="330" width="180" height="46" rx="6"/><text x="170" y="359" text-anchor="middle">▶ reply.wav</text></g>
  <g id="artifact" class="el box dashed"><rect x="80" y="390" width="180" height="50" rx="6"/>
    <text x="170" y="412" text-anchor="middle">▶ player</text><text x="170" y="430" text-anchor="middle" class="sub">inside the reply</text></g>
  <g id="jdsp" class="el box"><rect x="58" y="478" width="224" height="58" rx="8"/>
    <text x="170" y="503" text-anchor="middle">JamesDSP effect</text><text x="170" y="523" text-anchor="middle" class="sub">Liveprog script</text></g>
  <g id="speaker" class="el box"><rect x="58" y="556" width="224" height="44" rx="8"/><text x="170" y="584" text-anchor="middle">🔊 phone speaker</text></g>
  <g id="mark-phone" class="el mark bad"><text x="170" y="668" text-anchor="middle">✗ no code runs here</text></g>

  <!-- sandbox -->
  <g id="sandbox" class="el box frame"><rect x="390" y="80" width="480" height="420" rx="14"/>
    <text x="630" y="108" text-anchor="middle">Anthropic sandbox</text>
    <text x="630" y="127" text-anchor="middle" class="sub">where Claude's code runs</text></g>
  <g id="skill" class="el box"><rect x="420" y="142" width="420" height="44" rx="8"/><text x="630" y="170" text-anchor="middle">claude.ai skill "adjutant"</text></g>
  <g id="project" class="el box dashed"><rect x="430" y="194" width="400" height="32" rx="8"/><text x="630" y="215" text-anchor="middle" class="sub">or: a claude.ai Project with the same files</text></g>
  <g id="reword" class="el box"><rect x="420" y="246" width="200" height="62" rx="8"/>
    <text x="520" y="272" text-anchor="middle">spell: reword</text><text x="520" y="292" text-anchor="middle" class="sub">clear-speech rules</text></g>
  <g id="keep" class="el box"><rect x="640" y="246" width="200" height="62" rx="8"/>
    <text x="740" y="272" text-anchor="middle">say: as written</text><text x="740" y="292" text-anchor="middle" class="sub">no rewording</text></g>
  <g id="sayjs" class="el box"><rect x="490" y="340" width="280" height="52" rx="8"/>
    <text x="630" y="363" text-anchor="middle">say.js</text><text x="630" y="381" text-anchor="middle" class="sub">--out reply.wav --no-play</text></g>
  <g id="wav" class="el box"><rect x="560" y="428" width="140" height="44" rx="8"/><text x="630" y="456" text-anchor="middle">reply.wav</text></g>

  <!-- outside sites -->
  <g id="npm" class="el box good"><rect x="400" y="580" width="150" height="70" rx="8"/>
    <text x="475" y="608" text-anchor="middle">npm</text><text x="475" y="634" text-anchor="middle" class="badge">✓ approved</text></g>
  <g id="hf" class="el box warn"><rect x="565" y="580" width="170" height="70" rx="8"/>
    <text x="650" y="604" text-anchor="middle">Hugging Face</text><text x="650" y="622" text-anchor="middle" class="sub">voice model 78 MB</text>
    <text x="650" y="642" text-anchor="middle" class="badge">? not listed</text></g>
  <g id="github" class="el box dashed"><rect x="750" y="580" width="120" height="70" rx="8"/>
    <text x="810" y="610" text-anchor="middle">GitHub</text><text x="810" y="632" text-anchor="middle" class="sub">model copy</text></g>

  <!-- laptop, browser, clock -->
  <g id="laptop" class="el box"><rect x="960" y="80" width="280" height="130" rx="10"/>
    <text x="1100" y="118" text-anchor="middle">Laptop</text><text x="1100" y="146" text-anchor="middle" class="sub">say.js runs here</text>
    <text x="1100" y="172" text-anchor="middle">🔊 speakers</text></g>
  <g id="mark-laptop" class="el mark good"><text x="1100" y="236" text-anchor="middle">✓ code runs here</text></g>
  <g id="x-laptop" class="el cross"><path d="M1060 105 L1140 185 M1140 105 L1060 185"/></g>
  <g id="browser" class="el box"><rect x="960" y="270" width="280" height="80" rx="10"/>
    <text x="1100" y="304" text-anchor="middle">phone browser</text><text x="1100" y="328" text-anchor="middle" class="sub">voice page</text></g>
  <g id="x-browser" class="el cross"><path d="M1065 280 L1135 340 M1135 280 L1065 340"/></g>
  <g id="clock" class="el box warn"><rect x="960" y="390" width="280" height="80" rx="10"/>
    <text x="1100" y="424" text-anchor="middle">⏱ 30–60 s</text><text x="1100" y="450" text-anchor="middle" class="sub">first reply in a chat</text></g>

  <!-- arrows -->
  <g id="a-phone-sandbox" class="el arrow"><path d="M260 240 C 330 240, 340 164, 418 164"/></g>
  <g id="a-skill-reword" class="el arrow"><path d="M520 186 L520 244"/></g>
  <g id="a-skill-keep" class="el arrow"><path d="M740 186 L740 244"/></g>
  <g id="a-reword-say" class="el arrow"><path d="M520 308 L575 338"/></g>
  <g id="a-keep-say" class="el arrow"><path d="M740 308 L685 338"/></g>
  <g id="a-say-wav" class="el arrow"><path d="M630 392 L630 426"/></g>
  <g id="a-wav-phone" class="el arrow"><path d="M558 450 C 420 450, 360 353, 262 353"/></g>
  <g id="a-npm-say" class="el arrow"><path d="M475 578 C 475 480, 560 430, 580 394"/></g>
  <g id="a-hf-say" class="el arrow"><path d="M650 578 C 650 520, 720 470, 680 394"/></g>
  <g id="a-gh-say" class="el arrow"><path d="M810 578 C 810 470, 760 420, 720 394"/></g>
  <g id="a-phone-laptop" class="el arrow"><path d="M262 194 C 520 40, 760 60, 958 130"/></g>
  <g id="a-phone-browser" class="el arrow"><path d="M262 296 C 520 330, 760 310, 958 310"/></g>
  <g id="a-voice-jdsp" class="el arrow"><path d="M80 188 C 30 260, 30 420, 70 476"/></g>
  <g id="a-jdsp-speaker" class="el arrow"><path d="M170 536 L170 554"/></g>
</svg>
</div>
<div id="cards"></div>
<div id="caption"></div>
<div id="progress"></div>
<div id="start" class="hidden"><button id="play">▶ Play briefing</button><p>sound and diagram together, about four minutes</p></div>

<script src="data.js"></script>
<script>
(() => {
  const scenes = window.SCENES;
  if (/still/.test(location.hash)) document.head.insertAdjacentHTML('beforeend', '<style>*{transition:none!important}</style>');
  const GAP = 0.35;                         // seconds of silence between scenes (the external player uses the same)
  const $ = (id) => document.getElementById(id);
  const all = [...document.querySelectorAll('.el')];
  let offsets = [], t = 0;
  for (const s of scenes) { offsets.push(t); t += s.seconds + GAP; }
  const total = t;

  let shownScene = -1, shownStep = -1;
  function render(sceneIdx, stepIdx) {
    if (sceneIdx === shownScene && stepIdx === shownStep) return;
    const s = scenes[sceneIdx];
    const sceneChanged = sceneIdx !== shownScene;
    shownScene = sceneIdx; shownStep = stepIdx;
    // a part stays on once it has been pointed at within the scene
    const on = new Set(s.show);
    s.steps.slice(0, stepIdx + 1).forEach((st) => st.hl.forEach((id) => on.add(id)));
    const hl = new Set(stepIdx >= 0 ? s.steps[stepIdx].hl : []);
    for (const el of all) { el.classList.toggle('on', on.has(el.id)); el.classList.toggle('hl', hl.has(el.id)); }
    if (sceneChanged) {
      $('title').textContent = s.title;
      const c = $('cards'); c.classList.remove('in'); c.innerHTML = s.cards.map((x) => `<div>${x}</div>`).join('');
      requestAnimationFrame(() => requestAnimationFrame(() => c.classList.add('in')));
    }
    $('cards').classList.toggle('hl', hl.has('cards'));
    $('caption').innerHTML = s.steps.map((st, i) =>
      i === stepIdx ? `<span class="cur">${st.t}</span>` : (Math.abs(i - stepIdx) <= 1 ? `<span>${st.t}</span>` : '')
    ).filter(Boolean).join(' ');
  }
  function at(seconds) {               // position in the whole briefing → scene and sentence
    let i = 0; while (i + 1 < scenes.length && offsets[i + 1] <= seconds) i++;
    const local = seconds - offsets[i];
    let k = -1; scenes[i].steps.forEach((st, j) => { if (local >= st.at - 0.1) k = j; });
    render(i, Math.max(k, 0));
    $('progress').style.width = `${Math.min(100, (seconds / total) * 100)}%`;
  }

  // Mode 1: #start=<epoch ms> — the sound is played outside the page from that moment; follow the clock.
  const m = /start=(\d+)/.exec(location.hash);
  if (m) {
    const start = Number(m[1]);
    render(0, -1);
    const tick = () => {
      const s = (Date.now() - start) / 1000;
      if (s >= 0) at(s);
      if (s < total) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
    return;
  }

  // Mode 2: the page plays its own sound after a click.
  render(0, -1);
  $('start').classList.remove('hidden');
  const audios = scenes.map((s) => Object.assign(new Audio(s.audio), { preload: 'auto' }));
  $('play').onclick = async () => {
    $('start').classList.add('hidden');
    for (let i = 0; i < scenes.length; i++) {
      const a = audios[i];
      let raf;
      const follow = () => { at(offsets[i] + a.currentTime); raf = requestAnimationFrame(follow); };
      await a.play(); follow();
      await new Promise((r) => a.addEventListener('ended', r, { once: true }));
      cancelAnimationFrame(raf);
      await new Promise((r) => setTimeout(r, GAP * 1000));
    }
    at(total);
  };
})();
</script>
</body>
</html>
