<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Effect spike</title>
    <link rel="stylesheet" href="/src/page/style.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Dev only · not in the build</p>
        <h1>Effect spike</h1>
        <p class="lede">Loop a speech clip through the chain and tune it by ear. Export the values into <code>src/effect/preset.ts</code>.</p>
      </header>

      <section class="console">
        <div class="spike-row">
          <label>Speech file <input id="file" type="file" accept="audio/*" /></label>
        </div>
        <div class="spike-row">
          <input id="tts-text" type="text" value="Good morning, Commander. All systems are nominal." style="flex:1;min-width:0;min-height:40px;padding:0 12px" aria-label="Text to synthesise as the test clip" />
          <button id="tts" type="button">Synthesise clip</button>
        </div>
        <div class="actions">
          <button id="play" class="primary" type="button" disabled>Play loop</button>
          <button id="stop" type="button" disabled>Stop</button>
        </div>
        <div class="spike-row">
          <label><input id="dry" type="checkbox" /> Dry (bypass whole chain)</label>
        </div>
        <div class="spike-row" id="bypass"></div>
        <div id="status" class="status" data-state="idle"><span id="status-text">Load or synthesise a clip.</span></div>
      </section>

      <section class="advanced" style="padding-bottom:16px">
        <div id="controls" class="controls"></div>
        <div class="actions" style="padding:0 16px">
          <button id="export" type="button">Export parameters</button>
          <button id="reset" type="button">Reset to default</button>
        </div>
        <div style="padding:12px 16px 0">
          <textarea id="json" class="spike-export" readonly aria-label="Exported parameters"></textarea>
        </div>
      </section>
    </main>
    <script type="module" src="/src/spike/spike.ts"></script>
  </body>
</html>
